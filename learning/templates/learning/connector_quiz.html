{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connector Quiz — Quotable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0D0E14;--bg2:#12131A;--bg3:#17181F;--bg4:#20222C;
            --border:rgba(255,255,255,0.08);--t1:#ECECF1;--t2:#B4B5C0;--t3:#8E8F9B;
            --blue:#3b82f6;--blue-d:rgba(59,130,246,.12);
            --green:#4ADE80;--green-d:rgba(74,222,128,.15);
            --red:#ef4444;--red-d:rgba(239,68,68,.12);
            --amber:#f59e0b;--amber-d:rgba(245,158,11,.12);
            --purple:#a855f7;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
        a{color:var(--blue);text-decoration:none}

        .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;
             border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:50}
        .nav-left{display:flex;align-items:center;gap:12px}
        .nav a.back{color:var(--t2);font-size:14px}
        .nav .title{font-size:16px;font-weight:700}
        .nav .title em{color:var(--blue);font-style:normal}
        .nav .counter{font-size:13px;color:var(--t3);font-weight:500}

        /* HUB */
        .hub{max-width:500px;margin:0 auto;padding:24px 16px}
        .hub h2{font-size:24px;font-weight:800;margin-bottom:4px}
        .hub>p{color:var(--t2);font-size:14px;margin-bottom:20px}
        .hub-progress{color:var(--blue);font-size:13px;font-weight:600;margin-bottom:20px}
        .wc{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg3);
            border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .15s;
            border-left:3px solid var(--blue)}
        .wc:hover{background:var(--bg4)}
        .wc.done{border-left-color:var(--green)}
        .wc-word{font-weight:700;font-size:16px;flex:1}
        .wc-uz{color:var(--t3);font-size:13px;flex-shrink:0;margin-right:8px}
        .wc-score{font-size:12px;color:var(--t3);font-weight:600;min-width:30px;text-align:right}
        .wc-check{color:var(--green);font-size:16px;flex-shrink:0;width:20px;text-align:center}

        /* PRACTICE */
        .practice{max-width:500px;margin:0 auto;padding:24px 16px 80px;animation:fadeUp .25s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

        .p-word{font-size:28px;font-weight:800;color:var(--blue);margin-bottom:2px}
        .p-uz-word{font-size:15px;color:var(--t3);font-style:italic;margin-bottom:20px}

        /* Progress bar */
        .p-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
        .p-bar-label{font-size:13px;color:var(--t3);font-weight:600;white-space:nowrap}
        .p-bar-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
        .p-bar-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}

        /* Uzbek prompt */
        .uz-prompt{background:var(--bg3);border:1px solid var(--border);border-radius:12px;
                   padding:16px;margin-bottom:20px;text-align:center}
        .uz-prompt-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;
                         color:var(--blue);margin-bottom:8px}
        .uz-prompt-text{font-size:18px;font-weight:600;line-height:1.6;color:var(--t1)}

        @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

        /* Check button */
        .check-row{display:flex;justify-content:center;gap:10px}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:14px 28px;border-radius:10px;
             font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
        .btn-blue{background:var(--blue);color:#fff}
        .btn-blue:hover{filter:brightness(1.1);transform:translateY(-1px)}
        .btn-blue:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
        .btn-outline{background:transparent;color:var(--blue);border:1px solid var(--blue)}
        .btn-outline:hover{background:var(--blue-d)}

        /* Type input */
        .type-area{margin-bottom:16px}
        .type-input{width:100%;padding:14px 16px;border-radius:12px;font-size:16px;font-weight:500;
                    font-family:inherit;background:var(--bg3);border:2px solid var(--border);
                    color:var(--t1);outline:none;transition:border-color .2s}
        .type-input:focus{border-color:var(--blue)}
        .type-input.correct{border-color:var(--green);background:var(--green-d);color:var(--green)}
        .type-input.wrong{border-color:var(--red);background:var(--red-d);color:var(--red);animation:shake .4s ease}
        .type-input::placeholder{color:var(--t3)}

        /* Correct answer reveal */
        .correct-answer{text-align:center;padding:12px;margin-top:12px;font-size:15px;
                        color:var(--green);font-weight:600;animation:fadeUp .2s ease}

        /* Results */
        .results{max-width:400px;margin:0 auto;padding:60px 16px;text-align:center;animation:fadeUp .3s ease}
        .results-score{font-size:64px;font-weight:800;margin-bottom:4px}
        .results-label{font-size:14px;color:var(--t3);margin-bottom:16px}
        .results-msg{font-size:18px;font-weight:600;margin-bottom:24px}
        .results-bar{display:flex;gap:4px;justify-content:center;margin-bottom:24px}
        .results-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
        .results-dot.hit{background:var(--green)}
        .results-dot.miss{background:var(--red)}
        .results-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

        @media(max-width:480px){
            .p-word{font-size:24px}
            .uz-prompt-text{font-size:16px}
        }
    </style>
</head>
<body>
<div id="app"></div>
<script>
const SFX_CORRECT = '{% static "sounds/correct3.mp3" %}';
function playCorrect(){try{new Audio(SFX_CORRECT).play()}catch(e){}}

// ── Answer normalization & contraction handling ──
const norm=s=>s.toLowerCase().replace(/\[.*?\]/g,'').replace(/[.,!?;:'"…\-]+/g,'').replace(/\s+/g,' ').trim();
const CONTRACTIONS={
    "i'm":"i am","i'll":"i will","i'd":"i would","i've":"i have",
    "he's":"he is","she's":"she is","it's":"it is","that's":"that is",
    "we're":"we are","they're":"they are","you're":"you are",
    "we'll":"we will","they'll":"they will","you'll":"you will","it'll":"it will",
    "he'll":"he will","she'll":"she will",
    "we'd":"we would","they'd":"they would","you'd":"you would","he'd":"he would","she'd":"she would",
    "we've":"we have","they've":"they have","you've":"you have",
    "don't":"do not","doesn't":"does not","didn't":"did not",
    "isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not",
    "won't":"will not","wouldn't":"would not","couldn't":"could not","shouldn't":"should not",
    "can't":"cannot","haven't":"have not","hasn't":"has not","hadn't":"had not",
    "let's":"let us","there's":"there is","here's":"here is","who's":"who is","what's":"what is",
};
function expandAll(s){
    let r=s;
    for(const[k,v] of Object.entries(CONTRACTIONS)) r=r.replace(new RegExp(k.replace("'","'?"),'g'),v);
    return r;
}
function answersMatch(user,answer){
    const u=norm(user), a=norm(answer);
    // Also compare with brackets stripped (user can type with or without placeholder words)
    const aStrip=answer.toLowerCase().replace(/\[.*?\]/g,'').replace(/[.,!?;:'"…\-]+/g,'').replace(/\s+/g,' ').trim();
    return u===a || u===aStrip || expandAll(u)===expandAll(a) || expandAll(u)===expandAll(aStrip);
}
let _wrongCtx=null;
function playWrong(){
    try{
        if(!_wrongCtx)_wrongCtx=new(window.AudioContext||window.webkitAudioContext)();
        const c=_wrongCtx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
        o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.linearRampToValueAtTime(100,t+.25);
        g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
        o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.3);
    }catch(e){}
}
function playComplete(){
    try{
        const c=new(window.AudioContext||window.webkitAudioContext)(),t=c.currentTime;
        [523.25,659.25,783.99].forEach((f,i)=>{
            const o=c.createOscillator(),g=c.createGain();
            o.type='sine';o.frequency.value=f;
            g.gain.setValueAtTime(.08,t+i*.12);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.4);
            o.connect(g);g.connect(c.destination);o.start(t+i*.12);o.stop(t+i*.12+.5);
        });
    }catch(e){}
}

/* ── STATE ── */
const app=document.getElementById('app');
const CSRF='{{ csrf_token }}';
let S={screen:'hub',wordIdx:0,sentIdx:0,placed:[],results:[],answerStart:0};
function getMastery(){return JSON.parse(localStorage.getItem('conn_q')||'{}');}
function saveMastery(m){localStorage.setItem('conn_q',JSON.stringify(m));}
function _logToServer(word, sentIdx, sentence, correct, timems) {
    fetch('/learning/grammar/log/', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-CSRFToken':CSRF},
        body:JSON.stringify({
            unit_id: 100 + S.wordIdx,
            unit_title: 'Connector: ' + word,
            results:[{index:sentIdx, sentence:sentence, correct:correct, attempts:1, time_ms:timems}]
        })
    }).catch(()=>{});
}

function render(){
    if(S.screen==='hub')renderHub();
    else if(S.screen==='practice')renderPractice();
    else renderResults();
}

function renderHub(){
    const m=getMastery();
    const done=Object.values(m).filter(v=>v>=5).length;
    let html=`<div class="nav"><div class="nav-left">
        <a class="back" href="{% url 'learning:quiz' %}">&#8592; Quiz</a>
        <span class="title"><em>Connectors</em></span></div></div>
    <div class="hub">
        <h2>Connector Quiz</h2>
        <p>Read the Uzbek sentence, build it in English.</p>
        <div class="hub-progress">${done} / ${W.length} completed</div>`;
    W.forEach((w,i)=>{
        const sc=m[w.word]||0;
        const isDone=sc>=5;
        html+=`<div class="wc${isDone?' done':''}" onclick="startWord(${i})">
            <div class="wc-word">${w.word}</div>
            <div class="wc-uz">${w.uz}</div>
            <div class="wc-score">${sc}/5</div>
            <div class="wc-check">${isDone?'&#10003;':''}</div></div>`;
    });
    html+=`</div>`;
    app.innerHTML=html;
}

function startWord(i){
    S.screen='practice';S.wordIdx=i;S.sentIdx=0;S.results=[];
    render();window.scrollTo(0,0);
}


function renderPractice(){
    const w=W[S.wordIdx];
    const sent=w.sentences[S.sentIdx];

    app.innerHTML=`<div class="nav"><div class="nav-left">
        <a class="back" href="#" onclick="event.preventDefault();goHub()">&#8592; Back</a>
        <span class="title">${w.word}</span></div>
        <span class="counter">${S.sentIdx+1} / ${w.sentences.length}</span></div>
    <div class="practice">
        <div class="p-word">${w.word}</div>
        <div class="p-uz-word">${w.uz}</div>
        <div class="p-bar">
            <div class="p-bar-label">${S.sentIdx+1}/${w.sentences.length}</div>
            <div class="p-bar-track"><div class="p-bar-fill" style="width:${(S.sentIdx/w.sentences.length)*100}%"></div></div>
        </div>
        <div class="uz-prompt">
            <div class="uz-prompt-label">Translate to English</div>
            <div class="uz-prompt-text">${sent.uz}</div>
        </div>
        <div class="type-area">
            <input class="type-input" id="typeInput" type="text" placeholder="Type in English..."
                   autocomplete="off" autocapitalize="off" spellcheck="false"
                   onkeydown="if(event.key==='Enter')checkTypeAnswer()">
            <div class="check-row" style="margin-top:12px">
                <button class="btn btn-blue" id="checkBtn" onclick="checkTypeAnswer()">Check &#10003;</button>
            </div>
        </div>
        <div id="correctReveal"></div>
    </div>`;

    S.answerStart=Date.now();
    setTimeout(()=>{const inp=document.getElementById('typeInput');if(inp)inp.focus();},200);
}


function checkTypeAnswer(){
    const inp=document.getElementById('typeInput');
    if(!inp)return;
    const raw=inp.value.trim();
    if(!raw)return;

    const btn=document.getElementById('checkBtn');
    btn.disabled=true;
    inp.disabled=true;

    const w=W[S.wordIdx];
    const sent=w.sentences[S.sentIdx];
    const correctAnswer=sent.en;

    const isCorrect=answersMatch(raw,correctAnswer);
    const timems=Date.now()-S.answerStart;

    // Log to server
    _logToServer(w.word, S.sentIdx, correctAnswer, isCorrect, timems);

    if(isCorrect){
        playCorrect();
        inp.classList.add('correct');
        S.results.push(true);

        const m=getMastery();
        m[w.word]=Math.min((m[w.word]||0)+1,5);
        saveMastery(m);

        setTimeout(nextSentence,1200);
    } else {
        playWrong();
        inp.classList.add('wrong');
        S.results.push(false);

        document.getElementById('correctReveal').innerHTML=
            `<div class="correct-answer">&#10003; ${correctAnswer}</div>`;

        setTimeout(nextSentence,2500);
    }
}

function nextSentence(){
    S.sentIdx++;
    if(S.sentIdx>=W[S.wordIdx].sentences.length){
        S.screen='results';
        render();
    } else {
        renderPractice();
        window.scrollTo(0,0);
    }
}

function goHub(){S.screen='hub';render();}

function renderResults(){
    playComplete();
    const w=W[S.wordIdx];
    const correct=S.results.filter(r=>r).length;
    const total=S.results.length;
    const pct=Math.round((correct/total)*100);
    let msg='';
    if(pct===100)msg='Perfect! &#127775;';
    else if(pct>=80)msg='Great job!';
    else if(pct>=60)msg='Good, keep going!';
    else msg='Try again!';

    const hasNext=S.wordIdx+1<W.length;

    let html=`<div class="nav"><div class="nav-left">
        <a class="back" href="#" onclick="event.preventDefault();goHub()">&#8592; Back</a>
        <span class="title"><em>${w.word}</em></span></div></div>
    <div class="results">
        <div class="results-score" style="color:${pct>=80?'var(--green)':pct>=60?'var(--amber)':'var(--red)'}">${pct}%</div>
        <div class="results-label">${correct}/${total} correct</div>
        <div class="results-msg">${msg}</div>
        <div class="results-bar">`;
    S.results.forEach(r=>{
        html+=`<div class="results-dot ${r?'hit':'miss'}"></div>`;
    });
    html+=`</div>
        <div class="results-btns">
            <button class="btn btn-blue" onclick="startWord(${S.wordIdx})">Retry &#8635;</button>
            ${hasNext?`<button class="btn btn-outline" onclick="startWord(${S.wordIdx+1})">Next: ${W[S.wordIdx+1].word} &#8594;</button>`:''}
            <button class="btn btn-outline" onclick="goHub()">All words</button>
        </div>
    </div>`;
    app.innerHTML=html;
}

render();
</script>
{% include "learning/_page_tracker.html" with page_name="connector_quiz" %}
