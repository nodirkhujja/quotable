[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "nodirkhuj4",email = "hubergit7@gmail.com"}
]
license = {text = "MIT"}
readme = "README.rst"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.1,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "django-split-settings (>=1.3.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "pysrt (>=1.1.2,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "deep-translator (>=1.11.4,<2.0.0)",
    "edge-tts (>=7.2.7,<8.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "django-allauth (>=65.16.1,<66.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.black]
line-length = 119
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 119

[tool.flake8]
max-line-length = 119


[dependency-groups]
dev = [
    "pre-commit (>=4.5.1,<5.0.0)"
]
