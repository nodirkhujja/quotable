[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "nodirkhuj4",email = "hubergit7@gmail.com"}
]
license = {text = "MIT"}
readme = "README.rst"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.1,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "django-split-settings (>=1.3.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "pysrt (>=1.1.2,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "deep-translator (>=1.11.4,<2.0.0)",
    "edge-tts (>=7.2.7,<8.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "django-allauth (>=65.16.1,<66.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "structlog (>=25.0.0)",
    "celery[redis] (>=5.4.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "C9"]
ignore = ["A003", "C901", "E402", "E203", "B033", "E501"]

[tool.ruff.lint.per-file-ignores]
"learning/management/commands/seed_vocab.py" = ["E241", "E231"]
"learning/management/commands/extract_vocab.py" = ["B007"]
"learning/management/commands/import_learn.py" = ["F841"]
"learning/management/commands/import_translations.py" = ["F401", "F841"]
"learning/management/commands/import_transcript_translations.py" = ["B007"]
"learning/management/commands/import_usage.py" = ["F401"]
"learning/management/commands/seed_mastery_from_onboarding.py" = ["F401"]
"learning/views/__init__.py" = ["F401"]
"learning/views/_old.py" = ["F401", "F811", "F821"]
"learning/views/grammar.py" = ["F401", "F811"]
"learning/views/review.py" = ["F401"]
"learning/views/tracking.py" = ["F401", "F811"]
"learning/views/notebook.py" = ["F401"]
"learning/views/practice.py" = ["F401", "F811", "F821", "F841"]
"learning/views/onboarding.py" = ["F401", "B007"]
"learning/views/progress.py" = ["F401", "F811", "F821"]
"learning/utils/ai_grammar.py" = ["F401", "F541"]
"learning/utils/ai_own_word.py" = ["F841"]
"learning/utils/ai_word_bridge.py" = ["F401", "F841"]
"learning/utils/activity.py" = ["F401"]
"learning/utils/coach_engine.py" = ["F401", "F841", "F541"]
"learning/utils/quiz_engine.py" = ["F401", "F841", "E731", "B007"]
"learning/admin.py" = ["UP031"]
"learning/services/notebook.py" = []
"learning/models.py" = ["F401", "F821"]
"clips/management/commands/generate_scenes.py" = ["B904"]
"clips/management/commands/import_transcript.py" = ["B904"]
"clips/management/commands/process_subs.py" = ["B904"]
"learning/tests/test_bkt_unification.py" = ["F401"]
"learning/tests/test_free_production.py" = ["F401"]
"quiz/views.py" = ["F401", "F811", "F821", "F841"]
"quiz/tests.py" = ["F401"]
"scripts/batch_translate.py" = ["F401", "F541", "F841", "B007"]
"scripts/validate_grammar.py" = ["F401"]
"vocab/admin.py" = ["F401"]
"vocab/tests.py" = ["F401"]
"vocab/views.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[dependency-groups]
dev = [
    "pre-commit (>=4.5.1,<5.0.0)",
    "ruff (>=0.9.0)"
]
